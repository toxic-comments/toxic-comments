name: mlflow-deploy.yml
on:
  push:
    branches:
      - mlflow-setup
    paths:
      - 'mlflow/**'
jobs:
  deploy:
    name: Redeploy mlflow instance
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure ssh keys
        run: |
          mkdir ~/.ssh || touch ~/.ssh/mlflow_vm_ssh_key ~/.ssh/known_hosts
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/mlflow_vm_ssh_key
          chmod 600 ~/.ssh/mlflow_vm_ssh_key
          ssh-keyscan -t ed25519 "${{ vars.VM_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy mlflow config
        run: |
          scp -i ~/.ssh/mlflow_vm_ssh_key ./mlflow/docker-compose.yml ${{ vars.VM_USER }}@${{ vars.VM_HOST }}:/home/${{ vars.VM_USER }}/docker-compose.yml
      - name: Rerun containers
        run: ssh -i ~/.ssh/mlflow_vm_ssh_key "${{ vars.VM_USER }}@${{ vars.VM_HOST }}" "docker compose up -d"
