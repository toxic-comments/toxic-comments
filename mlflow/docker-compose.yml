services:
  postgres:
    image: postgres:16.2
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env
    volumes:
      - /opt/pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - /opt/minio-data:/data
    env_file:
      - ./.env
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "if", "http://localhost:9000/minio/health/live" ]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  minio-helper:
    image: quay.io/minio/mc
    container_name: minio-helper
    volumes:
      - /opt/minio-data:/data
    env_file:
      - ./.env
    entrypoint: >
      /bin/bash -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing minio/mlflow-bucket
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: mlflow
    ports:
      - "${MLFLOW_PORT}:5000"
    env_file:
      - ./.env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: ${HOST}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://${HOST}"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - bash
      - -c
      - |
        pip install boto3 psycopg2-binary --quiet
        mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} \
          --artifacts-destination s3://mlflow-bucket/mlflow \
          --serve-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio-helper:
        condition: service_completed_successfully
